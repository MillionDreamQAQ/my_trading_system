[instrument]
symbol = "XAU_USD"
provider = "oanda"
price_basis = "mid"
timezone = "UTC"
venue = "OANDA spot/CFD"
contract_unit = "1 troy ounce"
quote_currency = "USD"
tick_size = 0.01
point_value = 1.0

[timeframes]
base = "1min"
medium = "5min"
large = "30min"
timezone = "UTC"

[strategy]
direction = "both"
version = "breakout-quality-v1"

[trend]
ema_fast = 20
ema_slow = 60
slope_lookback = 5

[entry_point_2]
enabled = true
breakout_lookback = 20
volume_filter_enabled = true
volume_multiplier = 1.5
kline_quality_enabled = true
min_body_ratio = 0.65
max_close_extreme_ratio = 0.20
squeeze_filter_enabled = true
squeeze_lookback = 50
squeeze_recent_bars = 5
squeeze_percentile = 0.30

[entry_point_3]
enabled = false
pullback_min_atr = 0.5
pullback_min_bars = 2
max_setup_bars = 30

[risk]
atr_period = 14
stop_atr = 2.0
target_atr = 4.0
max_hold_bars = 80
structural_stop_enabled = true
structural_stop_buffer_atr = 0.5
swing_lookback = 20
breakeven_enabled = true
breakeven_trigger_atr = 1.5

[costs]
spread_model = "fixed"
spread_value = 0.0
slippage_model = "fixed"
slippage_value = 0.0
commission_per_unit = 0.0
require_explicit_costs = true

[position]
margin_per_trade = 1000.0
units_per_lot = 100.0
leverage = 20.0
max_positions = 1
