[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-research"
version = "0.1.0"
description = "Reproducible historical research tools for multi-timeframe gold signals"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.28",
]

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

